services:

  sales-agent:
    build: .
    container_name: sales_agent_api
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # live code reload during development
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload






  db:
    image: pgvector/pgvector:pg17
    container_name: sales_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"  # host:container — 5433 avoids clashing with a local Postgres
    volumes:
      - sales-agent-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  




volumes:
  sales-agent-db-data: