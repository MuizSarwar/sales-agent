services:

  db:
    image: pgvector/pgvector:pg17
    container_name: sales_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_agent
    ports:
      - "5433:5432"  # host:container — 5433 avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: sales_agent_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sales_agent
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # live code reload during development
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: